# Example DidaTrade startup config
# Lines starting with # are comments. Empty lines are ignored.
# Format: key=value   (no quotes needed)
#
# Shared defaults (used when a component does not set its own value):
host=localhost
port=9000
scheduler=A

# Servers — ids are 0 .. count-1; bind port is server.port + id
server.count=5
server.port=9000
server.scheduler=A

# Clients (app module) — ids start at app.id and increase by one
app.count=1
app.id=1
app.host=localhost
app.port=9000
app.scheduler=A

# Console
console.enabled=true
console.host=localhost
console.port=9000
console.scheduler=A
